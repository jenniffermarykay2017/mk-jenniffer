<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Tu Perfil de Belleza · Jenniffer Mary Kay</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --cream:#fff8f4;--warm:#fdeee8;--deep:#3d1a0f;
  --rose:#c9617a;--rose-soft:rgba(201,97,122,.08);--rose-border:rgba(201,97,122,.18);
  --gold:#b8843a;--gold-soft:rgba(184,132,58,.07);--gold-border:rgba(184,132,58,.16);
  --text:#3d1a0f;--mid:#7a4a38;--soft:#b08070;
  --card:#ffffff;
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'Jost',-apple-system,sans-serif;
}
html,body{min-height:100%;font-family:var(--sans);background:var(--cream);color:var(--text);overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 120% 50% at 50% 0%,rgba(253,220,210,.5) 0,transparent 60%),
             radial-gradient(ellipse 80% 60% at 90% 95%,rgba(255,230,200,.35) 0,transparent 55%)}
.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;align-items:center}

/* HEADER */
.header{width:100%;max-width:520px;padding:44px 24px 0;text-align:center}
.mk-tag{font-size:.56rem;letter-spacing:.35em;text-transform:uppercase;color:#b08070;margin-bottom:20px;display:flex;align-items:center;justify-content:center;gap:10px}
.mk-tag::before,.mk-tag::after{content:'';flex:1;height:1px;background:var(--rose-border);max-width:50px}
.hero{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,9vw,3.8rem);line-height:1.1;color:#2d1208;margin-bottom:14px}
.hero em{font-style:italic;color:var(--rose)}
.hero-line{width:36px;height:1px;background:var(--gold);margin:16px auto}
.hero-sub{font-size:.86rem;color:#7a4a38;line-height:1.85;max-width:300px;margin:0 auto}

/* PROGRESS */
.prog-wrap{width:100%;max-width:520px;padding:26px 24px 0}
.prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.prog-lbl{font-size:.56rem;letter-spacing:.25em;text-transform:uppercase;color:var(--soft)}
.prog-num{font-family:var(--serif);font-size:.95rem;color:var(--rose)}
.prog-w{height:2px;background:rgba(201,97,122,.12);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--gold));border-radius:2px;transition:width .7s cubic-bezier(.4,0,.2,1)}

/* QUIZ */
.quiz{width:100%;max-width:520px;padding:20px 24px 0;flex:1}

/* CARDS */
.card{background:var(--card);border:1px solid rgba(201,97,122,.1);border-radius:22px;padding:28px 22px 22px;box-shadow:0 8px 48px rgba(184,100,80,.08),0 2px 8px rgba(200,150,74,.05);animation:rise .42s cubic-bezier(.4,0,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.q-bloque{font-size:.56rem;letter-spacing:.28em;text-transform:uppercase;color:#b8843a;font-weight:600;margin-bottom:10px}
.q-texto{font-family:var(--serif);font-size:clamp(1.2rem,5vw,1.5rem);line-height:1.55;color:#2d1208;margin-bottom:8px;font-weight:400}
.q-hint{font-size:.8rem;color:#9a6050;font-style:italic;margin-bottom:22px;line-height:1.7}

/* OPTIONS */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{background:#fff;border:1.5px solid rgba(201,97,122,.15);border-radius:13px;padding:15px 17px;cursor:pointer;display:flex;align-items:flex-start;gap:13px;transition:all .24s;box-shadow:0 2px 8px rgba(200,120,80,.05)}
.opt:hover{background:rgba(255,255,255,.9);border-color:rgba(201,97,122,.3);transform:translateX(3px);box-shadow:0 3px 16px rgba(201,97,122,.09)}
.opt.sel{background:linear-gradient(135deg,rgba(201,97,122,.09),rgba(200,150,74,.06));border-color:var(--rose);box-shadow:0 4px 20px rgba(201,97,122,.13)}
.opt-dot{width:20px;height:20px;border-radius:50%;border:1.5px solid rgba(201,97,122,.28);flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .24s}
.opt.sel .opt-dot{background:var(--rose);border-color:var(--rose)}
.opt.sel .opt-dot::after{content:'';width:7px;height:7px;border-radius:50%;background:#fff}
.opt-body{display:flex;flex-direction:column;gap:4px}
.opt-main{font-size:.9rem;font-weight:500;color:#3d1a0f;line-height:1.4}
.opt-sub{font-size:.76rem;color:#7a4a38;font-style:italic;font-family:var(--serif);line-height:1.55}

/* MULTI SELECT */
.opt-check{width:20px;height:20px;border-radius:5px;border:1.5px solid rgba(201,97,122,.28);flex-shrink:0;margin-top:3px;display:flex;align-items:center;justify-content:center;transition:all .24s;font-size:.62rem;color:transparent}
.opt.sel .opt-check{background:var(--rose);border-color:var(--rose);color:#fff}

/* NEXT BTN */
.btn-next{width:100%;margin-top:16px;padding:16px;background:linear-gradient(135deg,var(--rose),#a83d52);border:none;border-radius:13px;color:#fff;font-family:var(--sans);font-size:.8rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:all .28s;box-shadow:0 5px 22px rgba(201,97,122,.28);opacity:0;pointer-events:none}
.btn-next.on{opacity:1;pointer-events:all}
.btn-next:hover{transform:translateY(-2px);box-shadow:0 9px 28px rgba(201,97,122,.36)}

/* FORM FIELDS */
.field-wrap{margin-bottom:10px}
.field-lbl{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase;color:#9a6050;display:block;margin-bottom:5px;font-weight:500}
.field-lbl span{color:var(--rose)}
.finp{width:100%;padding:13px 15px;border:1.5px solid rgba(201,97,122,.2);border-radius:11px;background:#fff;font-family:var(--sans);font-size:.88rem;color:#3d1a0f;outline:none;transition:all .22s;box-shadow:inset 0 1px 4px rgba(200,120,80,.05)}
.finp:focus{border-color:var(--rose);background:rgba(255,255,255,.92);box-shadow:0 0 0 3px rgba(201,97,122,.07)}
.finp::placeholder{color:rgba(45,26,15,.28)}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fsel{width:100%;padding:13px 15px;border:1.5px solid rgba(201,97,122,.2);border-radius:11px;background:#fff;font-family:var(--sans);font-size:.88rem;color:#3d1a0f;outline:none;-webkit-appearance:none;cursor:pointer;transition:all .22s}
.fsel:focus{border-color:var(--rose);background:rgba(255,255,255,.92)}
.bday-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* GRACIAS */
.gracias{text-align:center;padding:10px 0 20px;animation:rise .55s cubic-bezier(.4,0,.2,1)}
.g-ico{font-size:3rem;margin-bottom:16px;display:block;animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.g-title{font-family:var(--serif);font-size:clamp(1.7rem,7vw,2.5rem);font-weight:400;color:var(--deep);margin-bottom:10px}
.g-title em{font-style:italic;color:var(--rose)}
.g-sub{font-size:.88rem;color:#7a4a38;line-height:1.85;max-width:300px;margin:0 auto 24px}
.g-firma{font-family:var(--serif);font-style:italic;font-size:.96rem;color:var(--rose);margin-top:20px}

/* REGISTRO MK */
.mk-reg{background:linear-gradient(135deg,var(--gold-soft),var(--rose-soft));border:1.5px solid var(--gold-border);border-radius:14px;padding:18px 18px;margin-top:14px;text-align:center}
.mk-reg-title{font-family:var(--serif);font-size:1.05rem;color:var(--deep);margin-bottom:6px}
.mk-reg-sub{font-size:.76rem;color:var(--mid);line-height:1.75;margin-bottom:14px}
.btn-mk{display:inline-block;padding:11px 22px;background:linear-gradient(135deg,var(--gold),#a07030);color:white;border-radius:10px;font-size:.76rem;font-weight:500;text-decoration:none;letter-spacing:.1em;transition:all .25s}
.btn-mk:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(200,150,74,.3)}
.mk-optional{font-size:.62rem;color:var(--soft);margin-top:8px;display:block}

.footer{text-align:center;font-size:.58rem;color:#b08070;letter-spacing:.12em;padding:28px 24px 10px}
</style>
</head>
<body>
<div class="app">

<div class="header">
  <div class="mk-tag">Jenniffer Ivelisse · Mary Kay Puerto Rico</div>
  <h1 class="hero">Tu perfil<br>de <em>belleza</em></h1>
  <div class="hero-line"></div>
  <p class="hero-sub">Una conversación personal — sin presión, sin compromiso. Solo para conocerte mejor y darte exactamente lo que tu piel necesita.</p>
</div>

<div class="prog-wrap" id="progWrap">
  <div class="prog-top">
    <span class="prog-lbl">Tu recorrido</span>
    <span class="prog-num" id="progNum">1 / 12</span>
  </div>
  <div class="prog-w"><div class="prog-fill" id="progFill" style="width:8%"></div></div>
</div>

<div class="quiz" id="quiz"></div>

<p class="footer">marykay.com/jenniffer &nbsp;·&nbsp; Puerto Rico</p>
</div>

<script>
var answers={};
var cur=0;

var PASOS=[
  /* 0 — ALEX DEY: el desarmador */
  {
    tipo:'single',bloque:'Empecemos por ti',
    q:'Antes de empezar... ¿cuándo fue la última vez que hiciste algo <em>solo para ti</em>?',
    hint:'No hay respuesta correcta. Solo la tuya.',
    key:'ultima_vez_para_mi',
    opts:[
      {l:'Esta semana — me cuido y lo disfruto',s:'Tienes el hábito. Vamos a llevarlo más lejos.'},
      {l:'Hace tiempo — siempre hay algo más urgente',s:'La lista de los demás siempre gana. Eso también es dato.'},
      {l:'No recuerdo — el tiempo vuela',s:'La vida pasa rápido. Tu piel lo nota.'},
      {l:'Hoy — por eso estoy aquí',s:'El mejor momento para empezar es exactamente este.'}
    ]
  },
  /* 1 — MARY KAY: el letrero invisible */
  {
    tipo:'single',bloque:'Una pregunta diferente',
    q:'¿Con cuál de estas frases te identificas más cuando piensas en cuidarte?',
    hint:'La que más resuene — no la que "debería" ser.',
    key:'frase_identidad',
    opts:[
      {l:'Lo merezco — y lo sé',s:'Esa certeza lo cambia todo.'},
      {l:'Lo merezco pero me cuesta priorizarlo',s:'La intención está. El sistema es lo que falta.'},
      {l:'A veces me siento culpable por gastar en mí',s:'Eso que sientes tiene nombre — y tiene solución.'},
      {l:'Nunca lo pensé así — pero ahora que lo mencionas...',s:'Bienvenida al primer paso.'}
    ]
  },
  /* 2 — ALEX DEY: la herida honesta */
  {
    tipo:'single',bloque:'Tu piel hoy',
    q:'Cuando estás sin maquillaje, ¿cuál de estas frases te suena más familiar?',
    hint:'La respuesta que no le dirías a cualquiera — esa.',
    key:'sentimiento_sin_maquillaje',
    opts:[
      {l:'Prefiero que no me vean así',s:'Eso que sientes no es vanidad. Es una señal.'},
      {l:'Me conformo — no me quejo pero tampoco me gusta',s:'Conformarse es diferente a estar bien. Tú lo sabes.'},
      {l:'Cuido mi piel pero algo todavía le falta',s:'Ya empezaste. Solo falta el paso correcto.'},
      {l:'Me siento bien — quiero sentirme mejor',s:'Cuando algo funciona, siempre se puede llevar más lejos.'}
    ]
  },
  /* 3 — CONCIENTIZACIÓN DE PIEL */
  {
    tipo:'single',bloque:'Conociendo tu piel',
    q:'Sin humectante, tu piel se siente...',
    hint:'Piénsalo en la mañana, antes de cualquier producto.',
    key:'tipo_piel',
    opts:[
      {l:'Seca y estirada — como si le faltara agua',s:'Piel que pide hidratación constante.'},
      {l:'Grasa — brilla, especialmente en frente y nariz',s:'Piel con producción de sebo activa.'},
      {l:'Mixta — grasa en zona T, tranquila en mejillas',s:'Piel con dos personalidades. Necesita equilibrio.'},
      {l:'Normal pero sensible — reacciona fácil',s:'Piel delicada que necesita productos que la respeten.'},
      {l:'Bastante equilibrada',s:'Piel que coopera. Hay que mantenerla así.'}
    ]
  },
  /* 4 — MULTI: preocupaciones de piel */
  {
    tipo:'multi',bloque:'Lo que más te preocupa',
    q:'¿Qué le dirías a tu piel si pudiera escucharte? Selecciona todo lo que aplique.',
    hint:'Más de una puede resonar — todas cuentan.',
    key:'preocupaciones_piel',
    opts:[
      {l:'Manchas o tono desigual que no se van'},
      {l:'Resequedad que siempre vuelve'},
      {l:'Poros dilatados que se notan demasiado'},
      {l:'Líneas finas o arrugas que aparecieron de repente'},
      {l:'Acné o espinillas que siguen saliendo'},
      {l:'Brillo excesivo que arruina el maquillaje'},
      {l:'Piel opaca — me falta luminosidad'},
      {l:'Flacidez — siento que perdió firmeza'}
    ]
  },
  /* 5 — ÁREA DE OJOS */
  {
    tipo:'multi',bloque:'El área de tus ojos',
    q:'El área de los ojos es la que más habla de nosotras. ¿Qué notas en la tuya?',
    hint:'Selecciona todo lo que aplique.',
    key:'preocupaciones_ojos',
    opts:[
      {l:'Ojeras que no desaparecen con el sueño'},
      {l:'Bolsas o hinchazón en las mañanas'},
      {l:'Líneas finas alrededor — "patas de gallo"'},
      {l:'Flacidez en el párpado'},
      {l:'Se me irrita fácil cuando me quito el maquillaje'},
      {l:'Por ahora no tengo preocupaciones en esa área'}
    ]
  },
  /* 6 — LABIOS */
  {
    tipo:'multi',bloque:'Tus labios',
    q:'Los labios también necesitan amor. ¿Qué pasa con los tuyos?',
    hint:'Selecciona todo lo que aplique.',
    key:'preocupaciones_labios',
    opts:[
      {l:'Se resecan constantemente'},
      {l:'Líneas finas alrededor que se marcan'},
      {l:'Los quiero más definidos y con más color'},
      {l:'Busco un labial que dure todo el día'},
      {l:'Mis labios están bien — busco nuevos colores'}
    ]
  },
  /* 7 — ALEX DEY: la inversión pasada */
  {
    tipo:'single',bloque:'Tu experiencia',
    q:'¿Alguna vez invertiste en productos para tu piel y sentiste que no funcionaron?',
    hint:'La experiencia pasada nos dice mucho.',
    key:'experiencia_previa',
    opts:[
      {l:'Sí — varias veces y me frustré',s:'Ese dinero no fue tirado. Te enseñó qué no funciona para ti.'},
      {l:'Sí — una vez, y desde entonces soy muy cuidadosa',s:'Ese cuidado es sabio. La orientación correcta lo cambia todo.'},
      {l:'No he probado mucho — no sé por dónde empezar',s:'El primer paso con la guía correcta hace toda la diferencia.'},
      {l:'He encontrado cosas que funcionan — quiero más',s:'Eso me dice que tu piel responde bien. Hay más para descubrir.'}
    ]
  },
  /* 8 — RUTINA */
  {
    tipo:'single',bloque:'Tu rutina actual',
    q:'¿Cómo describirías tu rutina de cuidado de piel hoy?',
    hint:'Sin juicios — cada punto de partida es válido.',
    key:'rutina_actual',
    opts:[
      {l:'No tengo rutina — solo me lavo la cara',s:'El punto de partida más honesto. Y el mejor para empezar.'},
      {l:'Básica — limpieza y algo de humectante a veces',s:'Ya tienes el hábito. Solo falta la consistencia y los productos correctos.'},
      {l:'Completa mañana y noche — soy constante',s:'Con la rutina correcta, los resultados se multiplican.'},
      {l:'Variable — depende del tiempo que tenga',s:'Un sistema simple que quepa en tu vida real. Eso es lo que necesitas.'}
    ]
  },
  /* 9 — TONO DE PIEL */
  {
    tipo:'single',bloque:'Tu tono',
    q:'¿Cómo describirías tu tono de piel?',
    hint:'Para recomendarte exactamente lo correcto para ti.',
    key:'tono_piel',
    opts:[
      {l:'Muy claro / Ivory',s:''},
      {l:'Claro / Beige',s:''},
      {l:'Medio / Sand',s:''},
      {l:'Oliva / Tan',s:''},
      {l:'Oscuro / Mocha',s:''},
      {l:'Muy oscuro / Ebony',s:''}
    ]
  },
  /* 10 — INTERESES */
  {
    tipo:'multi',bloque:'¿Qué más te llama la atención?',
    q:'Selecciona todo lo que despierte tu curiosidad — sin compromiso.',
    hint:'',
    key:'intereses',
    opts:[
      {l:'Técnicas de maquillaje'},
      {l:'Fragancias para mí'},
      {l:'Fragancias para caballeros'},
      {l:'Generar ingresos extra desde casa'},
      {l:'Ideas para regalos'},
      {l:'Cuidado avanzado anti-edad'},
      {l:'Solo quiero cuidar mi piel — por ahora'}
    ]
  },
  /* 11 — DATOS PERSONALES */
  {
    tipo:'datos',bloque:'Casi llegamos',
    q:'¿A quién tengo el placer de atender?',
    hint:'Jenniffer te contactará personalmente — sin presión y a tu ritmo.'
  }
];

var TOTAL=PASOS.length;
var multiSel={};

function render(){
  var p=PASOS[cur];
  var pct=Math.round(((cur+1)/TOTAL)*100);
  document.getElementById('progFill').style.width=pct+'%';
  document.getElementById('progNum').textContent=(cur+1)+' / '+TOTAL;

  if(p.tipo==='datos'){renderDatos(p);return;}

  var html='<div class="card">';
  html+='<div class="q-bloque">'+p.bloque+'</div>';
  html+='<div class="q-texto">'+p.q+'</div>';
  if(p.hint)html+='<div class="q-hint">'+p.hint+'</div>';
  html+='<div class="opts">';

  if(p.tipo==='single'){
    p.opts.forEach(function(o,i){
      html+='<div class="opt" data-i="'+i+'" onclick="pickSingle('+i+')"><div class="opt-dot"></div><div class="opt-body"><div class="opt-main">'+o.l+'</div>'+(o.s?'<div class="opt-sub">'+o.s+'</div>':'')+'</div></div>';
    });
  } else if(p.tipo==='multi'){
    if(!multiSel[cur])multiSel[cur]=[];
    p.opts.forEach(function(o,i){
      var sel=multiSel[cur].indexOf(i)>=0?' sel':'';
      html+='<div class="opt'+sel+'" data-i="'+i+'" onclick="pickMulti('+i+')"><div class="opt-check">&#10003;</div><div class="opt-body"><div class="opt-main">'+o.l+'</div></div></div>';
    });
  }

  html+='</div>';
  html+='<button class="btn-next'+(p.tipo==='multi'?' on':'')+'" id="nxt" onclick="advance()">'+
    (cur<TOTAL-1?'Continuar &#8594;':'Ver mi perfil &#8594;')+'</button>';
  html+='</div>';
  document.getElementById('quiz').innerHTML=html;
}

function renderDatos(p){
  var html='<div class="card">';
  html+='<div class="q-bloque">'+p.bloque+'</div>';
  html+='<div class="q-texto">'+p.q+'</div>';
  html+='<div class="q-hint">'+p.hint+'</div>';

  html+='<div class="field-wrap"><label class="field-lbl">Nombre <span>*</span></label><input class="finp" id="d-nom" type="text" placeholder="Tu nombre" autocomplete="given-name"></div>';
  html+='<div class="field-wrap"><label class="field-lbl">Apellido</label><input class="finp" id="d-ape" type="text" placeholder="Tu apellido" autocomplete="family-name"></div>';
  html+='<div class="field-wrap"><label class="field-lbl">WhatsApp <span>* — para que Jenniffer te contacte</span></label><input class="finp" id="d-tel" type="tel" placeholder="787-XXX-XXXX" autocomplete="tel" inputmode="tel"></div>';
  html+='<div class="field-wrap"><label class="field-lbl">Correo electrónico</label><input class="finp" id="d-email" type="email" placeholder="correo@email.com" autocomplete="email"></div>';
  html+='<div class="field-wrap"><label class="field-lbl">Ciudad / Municipio</label><input class="finp" id="d-ciudad" type="text" placeholder="Ej: San Juan, Bayamón..."></div>';
  html+='<div class="field-wrap"><label class="field-lbl">¿Cómo llegaste hasta aquí?</label><select class="fsel" id="d-fuente"><option value="">Selecciona una opción</option><option>Facebook</option><option>Instagram</option><option>TikTok</option><option>Me lo compartió una amiga</option><option>WhatsApp</option><option>Zoom o evento</option><option>Busqué en Google</option><option>Otra forma</option></select></div>';

  html+='<div class="field-wrap"><label class="field-lbl">Cumpleaños 🎂</label>';
  html+='<div class="bday-row">';
  html+='<select class="fsel" id="d-dia"><option value="">Día</option>';
  for(var d=1;d<=31;d++)html+='<option value="'+d+'">'+d+'</option>';
  html+='</select>';
  html+='<select class="fsel" id="d-mes"><option value="">Mes</option><option value="01">Enero</option><option value="02">Febrero</option><option value="03">Marzo</option><option value="04">Abril</option><option value="05">Mayo</option><option value="06">Junio</option><option value="07">Julio</option><option value="08">Agosto</option><option value="09">Septiembre</option><option value="10">Octubre</option><option value="11">Noviembre</option><option value="12">Diciembre</option></select>';
  html+='<input class="finp" id="d-anio" type="text" placeholder="Año" maxlength="4" inputmode="numeric">';
  html+='</div></div>';

  html+='<div class="field-wrap"><label class="field-lbl">Prefiero que me contacten por</label><select class="fsel" id="d-contacto"><option value="">Selecciona una opción</option><option>WhatsApp</option><option>Llamada</option><option>Mensaje de texto</option><option>Correo electrónico</option><option>Como prefieras</option></select></div>';

  html+='<div class="field-wrap"><label class="field-lbl">¿Algo más que quieras compartir conmigo?</label><textarea class="finp" id="d-nota" placeholder="Opcional — cualquier cosa que te ayude a atenderte mejor..." style="min-height:70px;resize:none;line-height:1.6"></textarea></div>';

  html+='<button class="btn-next on" onclick="submitForm()" style="margin-top:6px">Enviar mi perfil &#10140;</button>';
  html+='</div>';
  document.getElementById('quiz').innerHTML=html;
}

function pickSingle(i){
  document.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel');});
  document.querySelectorAll('.opt')[i].classList.add('sel');
  answers[PASOS[cur].key]=PASOS[cur].opts[i].l;
  document.getElementById('nxt').classList.add('on');
}

function pickMulti(i){
  if(!multiSel[cur])multiSel[cur]=[];
  var idx=multiSel[cur].indexOf(i);
  if(idx>=0)multiSel[cur].splice(idx,1);else multiSel[cur].push(i);
  var el=document.querySelectorAll('.opt')[i];
  el.classList.toggle('sel',multiSel[cur].indexOf(i)>=0);
  var vals=multiSel[cur].map(function(j){return PASOS[cur].opts[j].l;});
  answers[PASOS[cur].key]=vals;
}

function advance(){
  cur++;
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}

function submitForm(){
  var nom=document.getElementById('d-nom').value.trim();
  var tel=document.getElementById('d-tel').value.trim();
  if(!nom){document.getElementById('d-nom').style.borderColor='var(--rose)';document.getElementById('d-nom').focus();return;}
  if(!tel){document.getElementById('d-tel').style.borderColor='var(--rose)';document.getElementById('d-tel').focus();return;}

  var dia=document.getElementById('d-dia').value;
  var mes=document.getElementById('d-mes').value;
  var anio=document.getElementById('d-anio').value.trim();
  var bday=dia&&mes?(dia+' / '+mes+(anio?' / '+anio:'')):'';

  answers.nombre=nom;
  answers.apellido=document.getElementById('d-ape').value.trim();
  answers.whatsapp=tel;
  answers.email=document.getElementById('d-email').value.trim();
  answers.ciudad=document.getElementById('d-ciudad').value.trim();
  answers.fuente=document.getElementById('d-fuente').value;
  answers.cumpleanos=bday;
  answers.contacto_pref=document.getElementById('d-contacto').value;
  answers.nota=document.getElementById('d-nota').value.trim();

  var btn=document.querySelector('.btn-next');
  if(btn){btn.disabled=true;btn.textContent='Enviando...';}

  var body=Object.assign({},answers,{
    _subject:'Nuevo perfil de clienta - '+nom,
    preocupaciones_piel:Array.isArray(answers.preocupaciones_piel)?answers.preocupaciones_piel.join(', '):'',
    preocupaciones_ojos:Array.isArray(answers.preocupaciones_ojos)?answers.preocupaciones_ojos.join(', '):'',
    preocupaciones_labios:Array.isArray(answers.preocupaciones_labios)?answers.preocupaciones_labios.join(', '):'',
    intereses:Array.isArray(answers.intereses)?answers.intereses.join(', '):''
  });

  fetch('https://formspree.io/f/xgoreqga',{
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify(body)
  }).then(function(){showGracias(nom);}).catch(function(){showGracias(nom);});
}

function showGracias(nom){
  document.getElementById('progWrap').style.display='none';
  document.getElementById('quiz').innerHTML=
    '<div class="gracias">'+
    '<span class="g-ico">&#127800;</span>'+
    '<h2 class="g-title">Gracias,<br><em>'+nom+'</em></h2>'+
    '<p class="g-sub">Tu perfil llegó a mis manos. Me pondré en contacto contigo personalmente — con calma, sin presión y con exactamente lo que tu piel necesita.</p>'+
    '<div class="mk-reg">'+
    '<div class="mk-reg-title">Un regalo más para ti ✨</div>'+
    '<p class="mk-reg-sub">¿Quieres recibir las novedades y ofertas de Mary Kay directamente — antes que nadie? Es completamente gratis y puedes salirte cuando quieras.</p>'+
    '<a href="https://www.marykay.com/jenniffer/es/login?rurl=%2Fjenniffer%2Fes%2Fhome" target="_blank" class="btn-mk">Sí, quiero recibir ofertas &#10140;</a>'+
    '<span class="mk-optional">Solo si quieres — es tu decisión</span>'+
    '</div>'+
    '<p class="g-firma">— Jenniffer Ivelisse, tu consultora Mary Kay &#127800;</p>'+
    '</div>';
}

render();
</script>
</body>
</html>
